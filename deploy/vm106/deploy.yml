---
- name: Deploy Matrix and MatrixRTC on VM106
  hosts: vm106
  become: true
  vars_files:
    - ../../roles/tuwunel/defaults/main.yml
  vars:
    domain:
      base: marux.ru
    deploy_user: alex
    docker:
      base_dir: /srv/docker
      network: matrix
    matrix_secrets_dir: "{{ lookup('env', 'HOME') }}/projects/shared/ops-secrets/home/vm106/matrix"
    vault_matrix:
      registration_token: "{{ lookup('ansible.builtin.password', matrix_secrets_dir + '/registration-token', length=64, chars=['ascii_letters', 'digits']) }}"
      livekit:
        key: "{{ lookup('ansible.builtin.password', matrix_secrets_dir + '/livekit-key', length=20, chars=['ascii_letters', 'digits']) }}"
        secret: "{{ lookup('ansible.builtin.password', matrix_secrets_dir + '/livekit-secret', length=64, chars=['ascii_letters', 'digits']) }}"
  pre_tasks:
    - name: Protect local Matrix credentials
      ansible.builtin.file:
        path: "{{ matrix_secrets_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Adapt the role to the existing VM and public gateway
      ansible.builtin.set_fact:
        tuwunel: "{{ tuwunel | combine({'ldap': {'enabled': false}, 'autoheal': false, 'port_bindings': ['192.168.10.106:8008:8008']}, recursive=true) }}"
        livekit: "{{ livekit | combine({'node_ip': '5.129.238.194', 'use_external_ip': false, 'listen_address': '192.168.10.106'}, recursive=true) }}"
        jwt_service: "{{ jwt_service | combine({'port_bindings': ['192.168.10.106:8081:8081']}, recursive=true) }}"
      no_log: true

    - name: Create the dedicated Matrix network
      community.docker.docker_network:
        name: "{{ docker.network }}"
        state: present

    - name: Permit the existing gateway to reach Matrix services
      community.general.ufw:
        rule: allow
        from_ip: 10.9.0.1
        to_ip: 192.168.10.106
        port: '8008,8081,7880,7881'
        proto: tcp
        comment: Matrix from tw-nl
  roles:
    - tuwunel

- name: Permit the Matrix gateway through the home router
  hosts: home-101
  gather_facts: false
  tasks:
    - name: Preserve the router firewall before Matrix setup
      ansible.builtin.raw: test -f /etc/config/firewall.pre-matrix || cp -p /etc/config/firewall /etc/config/firewall.pre-matrix
      changed_when: false

    - name: Allow only Matrix ports from tw-nl to VM106
      ansible.builtin.raw: |
        set -eu
        uci set firewall.matrix_tcp=rule
        uci set firewall.matrix_tcp.name='Matrix-TCP-tw-nl-to-vm106'
        uci set firewall.matrix_tcp.src='awg3'
        uci set firewall.matrix_tcp.src_ip='10.9.0.1'
        uci set firewall.matrix_tcp.dest='lan'
        uci set firewall.matrix_tcp.dest_ip='192.168.10.106'
        uci set firewall.matrix_tcp.proto='tcp'
        uci set firewall.matrix_tcp.dest_port='8008 8081 7880 7881'
        uci set firewall.matrix_tcp.target='ACCEPT'
        uci set firewall.matrix_udp=rule
        uci set firewall.matrix_udp.name='Matrix-WebRTC-tw-nl-to-vm106'
        uci set firewall.matrix_udp.src='awg3'
        uci set firewall.matrix_udp.src_ip='10.9.0.1'
        uci set firewall.matrix_udp.dest='lan'
        uci set firewall.matrix_udp.dest_ip='192.168.10.106'
        uci set firewall.matrix_udp.proto='udp'
        uci set firewall.matrix_udp.dest_port='50000-50050'
        uci set firewall.matrix_udp.target='ACCEPT'
        if [ -n "$(uci changes firewall)" ]; then
          uci commit firewall
          /etc/init.d/firewall reload
          echo matrix-firewall-updated
        fi
      register: matrix_router_firewall
      changed_when: "'matrix-firewall-updated' in matrix_router_firewall.stdout"

- name: Publish Matrix through the existing public gateway
  hosts: tw-nl
  become: true
  tasks:
    - name: Forward WebRTC media to VM106 with a return path through the tunnel
      ansible.builtin.blockinfile:
        path: /etc/ufw/before.rules
        backup: true
        insertafter: '^:POSTROUTING ACCEPT'
        marker: '# {mark} MatrixRTC VM106'
        block: |
          :PREROUTING ACCEPT [0:0]
          -A PREROUTING -i eth0 -d 5.129.238.194 -p tcp --dport 7881 -j DNAT --to-destination 192.168.10.106:7881
          -A PREROUTING -i eth0 -d 5.129.238.194 -p udp --dport 50000:50050 -j DNAT --to-destination 192.168.10.106
          -A POSTROUTING -o awgt -d 192.168.10.106 -p tcp --dport 7881 -j SNAT --to-source 10.9.0.1
          -A POSTROUTING -o awgt -d 192.168.10.106 -p udp --dport 50000:50050 -j SNAT --to-source 10.9.0.1
      register: matrix_nat

    - name: Allow forwarded WebRTC connections
      community.general.ufw:
        rule: allow
        route: true
        interface_in: eth0
        interface_out: awgt
        to_ip: 192.168.10.106
        to_port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: MatrixRTC VM106
      loop:
        - {port: '7881', proto: tcp}
        - {port: '50000:50050', proto: udp}

    - name: Load the persistent media forwarding rules
      ansible.builtin.command: ufw reload
      when: matrix_nat.changed

    - name: Read the existing Caddy configuration
      ansible.builtin.slurp:
        src: /home/deploy/caddy/Caddyfile
      register: matrix_caddy_original

    - name: Prepare a candidate without changing existing site routes
      ansible.builtin.copy:
        content: "{{ matrix_caddy_original.content | b64decode }}"
        dest: /home/deploy/caddy/Caddyfile.matrix-candidate
        owner: deploy
        group: deploy
        mode: '0644'

    - name: Advertise Matrix on the account domain
      ansible.builtin.blockinfile:
        path: /home/deploy/caddy/Caddyfile.matrix-candidate
        insertafter: '^marux\.ru \{$'
        marker: '# {mark} Matrix delegation'
        block: |
          handle /.well-known/matrix/client {
              reverse_proxy 192.168.10.106:8008
          }
          handle /.well-known/matrix/server {
              reverse_proxy 192.168.10.106:8008
          }

    - name: Route Matrix and LiveKit to VM106
      ansible.builtin.blockinfile:
        path: /home/deploy/caddy/Caddyfile.matrix-candidate
        marker: '# {mark} Matrix and MatrixRTC VM106'
        block: |
          matrix.marux.ru {
              reverse_proxy 192.168.10.106:8008
          }

          livekit.marux.ru {
              @jwt path /sfu/get* /healthz* /get_token*
              handle @jwt {
                  reverse_proxy 192.168.10.106:8081
              }
              handle {
                  reverse_proxy 192.168.10.106:7880
              }
          }

    - name: Read the candidate
      ansible.builtin.slurp:
        src: /home/deploy/caddy/Caddyfile.matrix-candidate
      register: matrix_caddy_candidate

    - name: Validate Caddy before applying the candidate
      ansible.builtin.command:
        argv: [docker, exec, -i, caddy, caddy, validate, --config, '-', --adapter, caddyfile]
        stdin: "{{ matrix_caddy_candidate.content | b64decode }}"
      changed_when: false

    - name: Back up Caddy before its first Matrix deployment
      ansible.builtin.copy:
        content: "{{ matrix_caddy_original.content | b64decode }}"
        dest: /home/deploy/caddy/Caddyfile.pre-matrix
        owner: deploy
        group: deploy
        mode: '0644'
        force: false

    - name: Write Caddy in place to preserve its Docker bind mount
      ansible.builtin.command:
        argv: [tee, /home/deploy/caddy/Caddyfile]
        stdin: "{{ matrix_caddy_candidate.content | b64decode }}"
      when: matrix_caddy_original.content != matrix_caddy_candidate.content
      no_log: true
      notify: Reload Caddy
  handlers:
    - name: Reload Caddy
      ansible.builtin.command: docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
